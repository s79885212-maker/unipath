<script>
/* The Russian dictionary is about 1 MB, so it is fetched only when Russian is
   the language in use. The choice is read exactly as assets/js/i18n.js reads it:
   ?lang= → saved choice → browser language. */
(function () {
  try {
    var m = /[?&]lang=([a-z]{2})\b/.exec(location.search);
    var lang = m ? m[1] : null;
    if (!lang) { try { lang = localStorage.getItem('unipath.lang'); } catch (e) {} }
    if (!lang) {
      var nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
      lang = String(nav).slice(0, 2).toLowerCase();
    }
    if (lang !== 'ru') return;
    var meta = document.querySelector('meta[name="unipath-root"]');
    var root = meta ? meta.content : '';
    document.write('<scr' + 'ipt src="' + root + 'data/i18n/ru.js?v=51"><\/scr' + 'ipt>');
  } catch (e) {}
})();
</script>
