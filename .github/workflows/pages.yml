# Publishes the site to GitHub Pages on every push to main.
# The site is built exactly as on Netlify (python3 build-artifact.py);
# BASE_PATH and SITE_URL tell the static pages where they will live.
# With a custom domain later, set BASE_PATH to "/" and SITE_URL to the domain.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the site
        env:
          BASE_PATH: /unipath/
          SITE_URL: https://s79885212-maker.github.io/unipath
        run: python3 build-artifact.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
